<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account — Hotel Haven</title><link rel="stylesheet" href="/css/auth.css"></head><body><main class="auth-shell"><a class="back" href="/">← Back to Haven</a><div class="auth-card"><p class="eyebrow">YOUR HAVEN AWAITS</p><h1>Create your account.</h1><p class="muted">Save your stays, book in a few clicks and keep your plans together.</p><form id="register-form"><label>Name<input name="name" type="text" minlength="2" required></label><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="8" required></label><p id="form-error" class="error"></p><button class="button" type="submit">Create account</button></form><p class="switch">Already have an account? <a href="/login">Sign in</a></p></div></main><script src="/js/auth.js"></script></body></html>
