<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — Hotel Haven</title><link rel="stylesheet" href="/css/auth.css"></head><body><main class="auth-shell"><a class="back" href="/">← Back to Haven</a><div class="auth-card"><p class="eyebrow">WELCOME BACK</p><h1>Come on in.</h1><p class="muted">Sign in to manage your stays and make your next booking.</p><form method="post" action="/login"><input type="hidden" name="_csrf" th:value="${_csrf.token}"><label>Email<input name="username" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="button" type="submit">Sign in</button></form><p class="switch">New here? <a href="/register">Create an account</a></p></div></main></body></html>
