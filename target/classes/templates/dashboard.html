<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your stays — Hotel Haven</title><link rel="stylesheet" href="/css/dashboard.css"></head><body><header class="dash-nav"><a class="brand" href="/">HAVEN<span>.</span></a><div><span id="welcome"></span><form method="post" action="/logout" style="display:inline"><input type="hidden" name="_csrf" th:value="${_csrf.token}"><button class="logout">Log out</button></form></div></header><main class="dashboard"><div class="dash-hero"><p class="eyebrow">YOUR HAVEN</p><h1>Your stays, <em>all in one place.</em></h1><p>Welcome back. Here’s where your next quiet morning begins.</p></div><section class="booking-panel"><div class="panel-head"><div><p class="eyebrow">BOOK A STAY</p><h2>Find your room.</h2></div><span id="total" class="total">—</span></div><form id="booking-form" class="booking-form"><label>Room<select id="room" required></select></label><label>Check-in<input id="checkIn" type="date" required></label><label>Check-out<input id="checkOut" type="date" required></label><label>Guests<input id="guests" type="number" min="1" value="2" required></label><button class="button" type="submit">Confirm booking</button></form><p id="booking-error" class="error"></p></section><section><div class="section-head"><div><p class="eyebrow">YOUR HISTORY</p><h2>Past & upcoming stays</h2></div></div><div id="bookings" class="history"></div></section></main><script src="/js/dashboard.js"></script></body></html>
